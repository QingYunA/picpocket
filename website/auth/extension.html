<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; connect-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Sign in — PicPocket</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/icon-64.png">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f6f5f2;
      color: #18181b;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
      border: 1px solid #e4e4e7;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    .logo { width: 48px; height: 48px; border-radius: 12px; }
    h1 { margin: 16px 0 6px; font-size: 18px; font-weight: 600; }
    p { margin: 0; font-size: 13px; line-height: 1.6; color: #52525b; }
    #google-button { display: flex; justify-content: center; margin-top: 24px; min-height: 44px; }
    #status { margin-top: 16px; min-height: 20px; font-size: 13px; }
    #status.error { color: #be123c; }
    #status.success { color: #047857; }
    @media (prefers-color-scheme: dark) {
      body { background: #080b13; color: #f4f4f5; }
      .card { background: #11151f; border-color: #262b36; box-shadow: none; }
      p { color: #a1a1aa; }
    }
  </style>
  <script defer src="https://umami.daydayup.lat/script.js" data-website-id="49031390-52c0-44c0-85de-68bfa7424469" data-domains="www.picpocket.top" data-exclude-search="true"></script>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/icon-192.png" alt="PicPocket">
    <h1 data-i18n="title">Sign in to PicPocket</h1>
    <p data-i18n="subtitle">Continue with your Google account. You will return to the extension automatically.</p>
    <div id="google-button"></div>
    <div id="status" role="status"></div>
  </main>

  <script src="/auth/extension.js" defer></script>
</body>
</html>
